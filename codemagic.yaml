workflows:
  android-debug:
    name: Build AutoMusic Debug APK
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Find Android SDK tools
        script: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== sdkmanager copies ==="
          find "$ANDROID_HOME" -type f -name sdkmanager -print 2>/dev/null || true
          echo "=== cmdline-tools ==="
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f 2>/dev/null | head -100 || true

      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/**/*.apk
